apiVersion: batch/v1
kind: CronJob
metadata:
  name: vpa-recommendation-exporter
  namespace: goldilocks
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vpa-recommendation-exporter
          restartPolicy: OnFailure
          containers:
            - name: exporter
              image: python:3.11-slim
              command: ["/bin/sh", "-c"]
              args: ["/scripts/RUN_SH"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 512Mi
              env:
                - name: REPO_URL
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: REPO_URL
                - name: REPO_BRANCH
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: REPO_BRANCH
                - name: TARGET_DIR
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: TARGET_DIR
                - name: GIT_AUTHOR_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: GIT_AUTHOR_NAME
                - name: GIT_AUTHOR_EMAIL
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: GIT_AUTHOR_EMAIL
                - name: EXCLUDE_NAMESPACES
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_NAMESPACES
                - name: EXCLUDE_TARGETS
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_TARGETS
                - name: EXCLUDE_NAMESPACE_LABELS
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_NAMESPACE_LABELS
                - name: EXCLUDE_NAMESPACE_ANNOTATIONS
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_NAMESPACE_ANNOTATIONS
                - name: EXCLUDE_WORKLOAD_LABELS
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_WORKLOAD_LABELS
                - name: EXCLUDE_WORKLOAD_ANNOTATIONS
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_WORKLOAD_ANNOTATIONS
                - name: EXCLUDE_POD_LABELS
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_POD_LABELS
                - name: EXCLUDE_POD_ANNOTATIONS
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: EXCLUDE_POD_ANNOTATIONS
                - name: LIMIT_POLICY
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: LIMIT_POLICY
                - name: LIMIT_FALLBACK_MULTIPLIER
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: LIMIT_FALLBACK_MULTIPLIER
                - name: MIN_REL_CHANGE
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: MIN_REL_CHANGE
                - name: MIN_CPU_MILLICORES
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: MIN_CPU_MILLICORES
                - name: MIN_MEM_BYTES
                  valueFrom:
                    configMapKeyRef:
                      name: vpa-recommendation-exporter
                      key: MIN_MEM_BYTES
                - name: GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: vpa-recommendation-exporter-git
                      key: username
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vpa-recommendation-exporter-git
                      key: token
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: vpa-recommendation-exporter
                defaultMode: 0755
