apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-goldilocks-label-by-project
spec:
  rules:
    - name: label-goldilocks-namespaces
      match:
        resources:
          kinds:
            - Namespace
      exclude:
        resources:
          selector:
            matchLabels:
              platform.suncoast.systems/goldilocks: "disabled"
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: v1
            kind: Namespace
        patchStrategicMerge:
          metadata:
            labels:
              goldilocks.fairwinds.com/enabled: "true"
