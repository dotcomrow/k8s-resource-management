apiVersion: batch/v1
kind: Job
metadata:
  name: vault-policy-externalsecrets
  namespace: goldilocks
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: policy
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args: ["python /scripts/bootstrap.py"]
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_KV_MOUNT
              value: "secret"
            - name: SECRET_PATH
              value: "goldilocks-vpa-write-token"
            - name: POLICY_NAME
              value: "externalsecrets-goldilocks-vpa"
            - name: AUTH_MOUNT
              value: "kubernetes"
            - name: ROLE_NAME
              value: "externalsecrets-goldilocks-vpa"
            - name: ALLOW_ROLE_CREATE
              value: "true"
            - name: BOUND_SERVICE_ACCOUNT_NAMES
              value: "external-secrets-sa"
            - name: BOUND_SERVICE_ACCOUNT_NAMESPACES
              value: "external-secrets"
            - name: ALIAS_NAME_SOURCE
              value: "serviceaccount_uid"
            - name: TOKEN_TTL
              value: "86400"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-root-token
                  key: VAULT_TOKEN
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: scripts
          configMap:
            name: vault-policy-externalsecrets
            defaultMode: 0755
