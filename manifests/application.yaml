apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-resource-management
  namespace: k8s-resource-management
spec:
  project: k8s-resource-management
  source:
    # TODO: update repoURL to your Git repo
    repoURL: https://github.com/dotcomrow/k8s-resource-management.git
    targetRevision: prod
    path: overlays/safe
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-resource-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
